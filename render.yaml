services:
  - type: web
    name: sankhyasetu-ai
    env: python
    region: oregon
    plan: free
    buildCommand:  pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
